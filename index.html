<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Pro | Kaveen Chamodya</title>
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/city/index.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --bg-dark: #080a0f;
            --card-bg: rgba(255, 255, 255, 0.05);
            --footer-text: #ffffff;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* 3D Intro Loader */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
            transition: opacity 1s ease-out;
        }

        .intro-animation { position: absolute; width: 100%; height: 100%; z-index: 1; }

        .loader-content {
            position: absolute; bottom: 12%; z-index: 2;
            text-align: center; width: 100%;
        }

        .spinner {
            width: 35px; height: 35px; border: 3px solid rgba(0, 242, 254, 0.1);
            border-top: 3px solid var(--primary-color); border-radius: 50%;
            animation: spin 1s infinite linear; margin: 0 auto 10px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loading-text {
            font-size: 0.9rem; font-weight: 500; letter-spacing: 3px;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Main Wrapper */
        .main-wrapper {
            width: 95%; max-width: 1000px; margin: 15px auto;
            display: none; flex-direction: column; gap: 15px;
            padding: 10px; height: 95vh; overflow-y: auto;
        }

        .player-section {
            background: var(--card-bg); backdrop-filter: blur(20px);
            padding: 10px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-js { width: 100%; height: 450px; border-radius: 10px; }

        /* Search Bar */
        .search-container {
            position: sticky; top: 0; z-index: 100;
            background: rgba(9, 10, 15, 0.95); backdrop-filter: blur(15px);
            padding: 10px 0;
        }

        .search-input {
            width: 100%; padding: 12px 20px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white; font-family: 'Poppins', sans-serif;
            font-size: 13px; outline: none; box-sizing: border-box;
        }

        .search-input:focus { border-color: var(--primary-color); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }

        /* Channel Grid */
        .channel-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 10px; margin-bottom: 20px;
        }

        .channel-card {
            background: rgba(255, 255, 255, 0.07); padding: 10px 5px;
            text-align: center; border-radius: 10px; cursor: pointer;
            transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 11.5px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            min-height: 45px;
        }

        .channel-card:hover, .channel-card.active {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: #000; font-weight: 700; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }

        h3 {
            color: var(--primary-color); border-left: 4px solid var(--primary-color);
            padding-left: 10px; margin: 15px 0 10px; font-size: 13px;
            text-transform: uppercase;
        }

        /* Yata Thiyena Footer Eka */
        .footer-note {
            text-align: center;
            padding: 30px 20px;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .footer-note p {
            margin: 5px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
        }

        .footer-note b, .footer-note span {
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            font-weight: 700;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .video-js { height: 220px; }
            .channel-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="intro-animation">
            <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js"></script>
            <spline-viewer url="https://prod.spline.design/UWoeqiir20o49Dah/scene.splinecode"></spline-viewer>
        </div>
        <div class="loader-content">
            <div class="spinner"></div>
            <div class="loading-text" id="status-text">INITIALIZING HD STREAM...</div>
        </div>
    </div>

    <div class="main-wrapper" id="player-ui">
        <div class="player-section">
            <video id="my-video" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto">
                <p class="vjs-no-js">JavaScript required.</p>
            </video>
        </div>

        <div class="search-container">
            <input type="text" id="channelSearch" class="search-input" placeholder="Search Channels..." onkeyup="filterChannels()">
        </div>

        <div class="channel-container">
            <div id="featured-section">
                <h3 id="feat-head">Featured Channels</h3>
                <div class="channel-grid">
                    <div class="channel-card active" onclick="playStatic(this, 'https://tvsen6.aynaott.com/ColorsHD/index.m3u8')">Colors Hd</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://tvsen6.aynaott.com/ColorsBangla/index.m3u8')">Colors Bangla</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://live-en.aisports.cc/moviebox/device01/playlist.m3u8')">🔒 Jio Hotstar</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://tvsen5.aynaott.com/PtvSports/index.m3u8')">Ptv Sports</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://tvsen5.aynaott.com/willowhd/index.m3u8')">Willow Cricket Hd</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://tvsen5.aynaott.com/cXPB2LKkErN9/index.m3u8')">Star Sport 2 Hd</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://tvsen7.aynaott.com/ssps2hd/index.m3u8')">Star Sport Select 2 Hd</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://tvsen6.aynaott.com/asports/index.m3u8')">A Sports</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://tvsen7.aynaott.com/tsportshd/index.m3u8')">T Sports Hd</div>
                    <div class="channel-card" onclick="playStatic(this, 'https://tplay.live/playlist/kids/motu-patlu/index.m3u8')">Motu Patlu</div>
                </div>
            </div>

            <h3 id="play-head">Playlist Channels</h3> 
            <div class="channel-grid" id="playlist-channels"></div>
        </div>

        <footer class="footer-note">
            <p>&copy; 2025 All Rights Reserved</p>
            <p>Designed & Powered By <b>Kaveen Chamodya</b></p>
        </footer>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-video', { fluid: true });
        const m3uUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://is.gd/YJ307U');

        function toTitleCase(str) {
            return str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function playStatic(element, url) {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterChannels() {
            let input = document.getElementById('channelSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('channel-card');
            let featHead = document.getElementById('feat-head');
            let playHead = document.getElementById('play-head');

            if (input.length > 0) { featHead.style.display = 'none'; playHead.style.display = 'none'; }
            else { featHead.style.display = 'block'; playHead.style.display = 'block'; }

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].innerText.toLowerCase();
                cards[i].style.display = name.includes(input) ? "flex" : "none";
            }
        }

        async function fetchPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                const data = await response.text();
                
                setTimeout(() => {
                    document.getElementById('status-text').innerText = "System Ready !!";
                    setTimeout(() => {
                        parseM3U(data);
                        const loader = document.getElementById('loader');
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                            document.getElementById('player-ui').style.display = 'flex';
                            document.body.style.overflow = 'auto';
                        }, 1000);
                    }, 1200);
                }, 5000); 
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('player-ui').style.display = 'flex';
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const container = document.getElementById('playlist-channels');
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF')) {
                    let name = lines[i].split(',')[1]?.trim() || "Unknown Channel";
                    let url = lines[i+1]?.trim();
                    if (url && url.startsWith('http')) {
                        const card = document.createElement('div');
                        card.className = 'channel-card';
                        card.innerText = toTitleCase(name);
                        card.onclick = function() {
                            playStatic(this, url);
                        };
                        container.appendChild(card);
                    }
                }
            }
        }

        window.onload = function() {
            player.src({ src: 'https://tvsen6.aynaott.com/ColorsHD/index.m3u8', type: 'application/x-mpegURL' });
            fetchPlaylist();
        };
    </script>
</body>
</html>
